[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    ui: Маркировка для UI тестов.
    slow: Маркировка для медленных тестов.
    smoke: Маркировка для смоук тестов.
    custom: Маркировка для тестов.
    courses: Маркировка для тестов, связанных с курсами.
    test1234: Маркировка для тестов.
    critical: Маркировка для критичных тестов.
    training: Маркировка для тренировки прогонов тестов.
    dashboard: Маркировка для тестов, связанных с рабочей панелью. 
    regression: Маркировка для регрессионных тестов.
    registration: Маркировка для тестов, связанных с регистрацией пользователей.
    authorization: Маркировка для тестов, связанных с авторизацией пользователся.

